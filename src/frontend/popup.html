<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Biscotty</title><link rel="stylesheet" href="styles.css"><script type="module" src="popup.js"></script></head>
<body class="popup"><header class="brand"><img src="../../assets/icon.svg" alt=""><div><p class="eyebrow">Cookie care, on your terms</p><h1>Biscotty</h1></div></header><main><div id="messages" tabindex="-1" aria-live="polite"></div><section id="site" class="card" aria-label="Current site"><h2>Current site</h2><p>Checking saved protection…</p></section><section id="burner" class="card" aria-label="Cookie burner"><h2>Cookie burner</h2><p>Loading…</p></section></main><footer><small>Local. Manual. No history.</small><button id="settings" type="button">Settings</button></footer><dialog id="site-rule-dialog" aria-labelledby="site-rule-heading"><h2 id="site-rule-heading">Edit cookie protection</h2><div id="site-rule-notices" aria-live="polite"></div><div id="site-rule-sources"></div><form id="site-rule-form"><div id="site-rule-fields"></div><div id="site-rule-errors" tabindex="-1" aria-live="polite"></div><div class="actions"><button id="save-site-rule" type="submit" class="primary">Save protection</button><button id="cancel-site-rule" type="button">Cancel</button></div></form></dialog></body></html>
