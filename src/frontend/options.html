<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Biscotty settings</title><link rel="stylesheet" href="styles.css"><script type="module" src="options.js"></script></head>
<body><main class="options"><header class="options-header"><div class="brand"><img src="../../assets/icon.svg" alt=""><div><h1>Biscotty</h1><small>Settings</small></div></div><div class="actions"><button id="status-indicator" type="button">Status</button><button id="refresh" type="button">↻ Refresh</button></div></header><div id="messages" tabindex="-1" aria-live="polite"></div><nav class="settings-tabs" role="tablist" aria-label="Settings sections"><button type="button" role="tab" id="tab-cookies" aria-controls="panel-cookies" aria-selected="true" tabindex="0" data-panel="cookies"><span>01</span> Cookies</button><button type="button" role="tab" id="tab-rules" aria-controls="panel-rules" aria-selected="false" tabindex="-1" data-panel="rules"><span>02</span> Rules</button><button type="button" role="tab" id="tab-containers" aria-controls="panel-containers" aria-selected="false" tabindex="-1" data-panel="containers"><span>03</span> Containers</button><button type="button" role="tab" id="tab-transfer" aria-controls="panel-transfer" aria-selected="false" tabindex="-1" data-panel="transfer"><span>04</span> Import / Export</button><button type="button" role="tab" id="tab-access" aria-controls="panel-access" aria-selected="false" tabindex="-1" data-panel="access"><span>05</span> Status</button></nav><div id="panel-cookies" role="tabpanel" aria-labelledby="tab-cookies" tabindex="0"><section class="card" id="cookies-section" aria-labelledby="cookies-heading"><h2 id="cookies-heading">Cookie inventory</h2><form id="cookie-search-form"><div class="two-columns"><label class="field"><span>Search metadata</span><input id="cookie-search" type="search" placeholder="Domain, name, path, or protection"></label><label class="field"><span>Cookie store</span><select id="cookie-store"><option value="">All available stores</option></select></label></div><div class="actions"><button id="load-cookies" type="submit">Search cookies</button></div></form><div id="cookie-results" aria-live="polite"></div><div class="actions"><button type="button" id="next-cookies" hidden>Next page</button></div></section></div><div id="panel-rules" role="tabpanel" aria-labelledby="tab-rules" tabindex="0" hidden><section class="card" id="rules-section" aria-labelledby="rules-heading"><h2 id="rules-heading">Cookie allow rules</h2><div class="two-columns"><label class="field"><span>Search rules</span><input id="rule-search" type="search" placeholder="Domain, exact name, path, or store"></label><div class="actions"><button type="button" id="add-rule">Add allow rule</button></div></div><div id="rules-list"></div><div id="rules-pages" class="actions"></div></section></div><div id="panel-containers" role="tabpanel" aria-labelledby="tab-containers" tabindex="0" hidden><section class="card" id="containers-section" aria-labelledby="containers-heading"><h2 id="containers-heading">Protected containers</h2><div id="containers"></div></section></div><div id="panel-transfer" role="tabpanel" aria-labelledby="tab-transfer" tabindex="0" hidden><section class="card" id="transfer-section" aria-labelledby="transfer-heading"><h2 id="transfer-heading">Import &amp; export</h2><div class="actions"><button id="export" type="button">Export saved settings</button><button id="start-import" type="button">Import configuration</button></div><div id="import-workflow"></div></section></div><div id="panel-access" role="tabpanel" aria-labelledby="tab-access" tabindex="0" hidden><section class="card" aria-labelledby="availability-heading"><h2 id="availability-heading">Status</h2><div id="availability" aria-live="polite">Checking…</div><button id="request-access" type="button">Restore website access</button></section></div><div class="settings-footer"><nav class="section-pager" aria-label="Section pages"><button id="previous-section" type="button">← Previous section</button><span id="section-page" aria-live="polite"></span><button id="next-section" type="button">Next section →</button></nav><div class="savebar"><p id="draft-status" role="status">Loading saved settings…</p><div class="actions"><button id="cancel" type="button">Cancel changes</button><button id="save" class="primary" type="button">Save changes</button></div></div></div></main><dialog id="rule-dialog" aria-labelledby="rule-dialog-heading"><h2 id="rule-dialog-heading">Allow rule</h2><form id="rule-form"><label class="field"><span>Domain</span><input id="rule-domain" required maxlength="253" placeholder="example.com" autocomplete="off"><small>Hostname only. No scheme, port, path, wildcard, or regular expression.</small></label><label class="check"><input id="rule-subdomains" type="checkbox"><span>Include this domain and all its subdomains</span></label><div class="two-columns"><div><label class="check"><input id="rule-any-name" type="checkbox" checked><span>Every cookie name</span></label><label class="field"><span>Exact cookie name</span><input id="rule-name" maxlength="8192" disabled><small>Case-sensitive exact text. An empty name is different from every name.</small></label></div><div><label class="check"><input id="rule-any-path" type="checkbox" checked><span>Every cookie path</span></label><label class="field"><span>Exact cookie path</span><input id="rule-path" maxlength="8192" disabled placeholder="/"><small>A specific path starts with /. The path / is exact.</small></label></div></div><label class="field"><span>Rule scope</span><select id="rule-scope" aria-describedby="rule-scope-help"><option value="all">All stores</option><option value="selected">Selected stores</option></select><small id="rule-scope-help">All stores includes Normal browsing and every current or future named container. Selected stores protects only the checked stores.</small></label><fieldset id="rule-stores" hidden><legend>Selected stores</legend><div id="rule-store-options"></div></fieldset><div id="rule-errors" role="alert"></div><div class="actions"><button type="submit" class="primary">Keep in draft</button><button id="close-rule" type="button">Cancel rule</button></div></form></dialog><dialog id="discard-dialog" aria-labelledby="discard-heading"><h2 id="discard-heading">Discard unsaved changes?</h2><p>Your saved protection will stay in effect.</p><div class="actions"><button id="confirm-discard" type="button">Discard draft</button><button id="keep-draft" type="button" class="primary">Keep editing</button></div></dialog></body></html>
